<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_AS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F07832" />
      <stop offset="100%" stop-color="#D55310" />
    </linearGradient>
    <linearGradient id="glow_AS" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F07832" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2" />
    </linearGradient>
    <clipPath id="circleClip_AS">
      <circle cx="100" cy="100" r="100" />
    </clipPath>
  </defs>

  <!-- Background Base -->
  <g clip-path="url(#circleClip_AS)">
    <rect width="200" height="200" fill="#1E232E" />
    <circle cx="100" cy="100" r="100" fill="url(#grad_AS)" opacity="0.3" />
    
    <!-- Ambient Inner Glow Rings -->
    <circle cx="100" cy="100" r="88" fill="none" stroke="url(#glow_AS)" stroke-width="2" opacity="0.4" />
    <circle cx="100" cy="100" r="76" fill="none" stroke="#FFE5D9" stroke-width="1" opacity="0.2" stroke-dasharray="4 6" />
    
    <!-- Abstract Modern Avatar Illustration -->
    <!-- Head -->
    <circle cx="100" cy="74" r="34" fill="url(#grad_AS)" />
    <circle cx="100" cy="74" r="30" fill="#FFE5D9" opacity="0.9" />
    
    <!-- Body / Shoulders -->
    <path d="M42,172 C46,128 72,118 100,118 C128,118 154,128 158,172 C159,182 150,192 140,192 L60,192 C50,192 41,182 42,172 Z" fill="url(#grad_AS)" />
    <path d="M52,172 C56,138 78,128 100,128 C122,128 144,138 148,172 Z" fill="#FFE5D9" opacity="0.85" />

    <!-- Initials Floating Badge Overlay -->
    <circle cx="148" cy="148" r="24" fill="#1E232E" stroke="#F07832" stroke-width="3" />
    <text x="148" y="154" font-family="'Phudu', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">AS</text>
  </g>

  <!-- Subtle Outer Precision Ring -->
  <circle cx="100" cy="100" r="98" fill="none" stroke="#F07832" stroke-width="3" opacity="0.6" />
</svg>