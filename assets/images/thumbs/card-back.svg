      <rect x="206" y="0" width="14" height="85"/>
      <rect x="228" y="0" width="8" height="85"/>
      <rect x="244" y="0" width="12" height="85"/>
      <rect x="264" y="0" width="6" height="85"/>
      <rect x="278" y="0" width="18" height="85"/>
