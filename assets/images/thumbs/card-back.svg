      <rect x="-96" y="0" width="18" height="85"/>
      <rect x="-70" y="0" width="10" height="85"/>
      <rect x="-52" y="0" width="6" height="85"/>
      <rect x="-38" y="0" width="16" height="85"/>
      <rect x="-14" y="0" width="8" height="85"/>
      <rect x="2" y="0" width="12" height="85"/>
      <rect x="22" y="0" width="4" height="85"/>
      <rect x="34" y="0" width="18" height="85"/>
