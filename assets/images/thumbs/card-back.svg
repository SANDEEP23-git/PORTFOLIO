<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1440" viewBox="0 0 1024 1440">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b0d"/>
      <stop offset="50%" stop-color="#121417"/>
      <stop offset="100%" stop-color="#0a0b0d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d5fa01"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1440" fill="url(#bg)"/>
  <rect width="1024" height="1440" fill="url(#grid)"/>

  <!-- Border & Corner Accents -->
  <rect x="40" y="40" width="944" height="1360" rx="36" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <rect x="56" y="56" width="912" height="1328" rx="24" fill="none" stroke="rgba(213,250,1,0.2)" stroke-width="1.5" stroke-dasharray="8 6"/>

  <!-- Top Lanyard Slot Guide / Accent Header -->
  <rect x="362" y="70" width="300" height="40" rx="20" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <circle cx="512" cy="90" r="12" fill="#d5fa01"/>

  <!-- Organization Logo & Header -->
  <g transform="translate(512, 230)" text-anchor="middle">
    <!-- Monogram SP -->
    <rect x="-60" y="-60" width="120" height="120" rx="28" fill="#181a1f" stroke="url(#accent)" stroke-width="3"/>
    <text x="0" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#d5fa01" letter-spacing="2">SP</text>
    
    <text x="0" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="6">SANVEX</text>
    <text x="0" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="rgba(255,255,255,0.45)" letter-spacing="4">DEVELOPER PASS // 2026</text>
  </g>

  <!-- Horizontal Divider -->
  <line x1="120" y1="440" x2="904" y2="440" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>

  <!-- Member Name & Roles -->
  <g transform="translate(512, 530)" text-anchor="middle">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="1">SANDEEP PATRA</text>
    <rect x="-180" y="24" width="360" height="42" rx="21" fill="rgba(213,250,1,0.12)" stroke="#d5fa01" stroke-width="1.5"/>
    <text x="0" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#d5fa01" letter-spacing="2">DATA SCIENCE &amp; AIML</text>
  </g>

  <!-- Info Grid -->
  <g transform="translate(140, 680)">
    <!-- Column 1 -->
    <g transform="translate(0, 0)">
      <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="rgba(255,255,255,0.4)" letter-spacing="2">AFFILIATION</text>
      <text x="0" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#ffffff">NIT BBSR</text>
      <text x="0" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.6)">B.Tech CSE (8.9 CGPA)</text>
    </g>

    <!-- Column 2 -->
